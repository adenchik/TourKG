{% extends 'base.html' %}

{% block title %}Оффлайн - TourKG{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-16">
    <div class="max-w-md w-full text-center">
        <div class="w-20 h-20 glass rounded-2xl flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-white mb-3">Нет подключения</h1>
        <p class="text-white/50 text-sm mb-8">
            Похоже, вы не подключены к интернету. Проверьте соединение и попробуйте снова.
        </p>

        <button onclick="window.location.reload()" class="w-full btn-glow py-3 font-medium text-sm">
            Попробовать снова
        </button>
    </div>
</div>
{% endblock %}
